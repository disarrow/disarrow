<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 地球查看器</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 20%, #1b2a4a 0%, #090d17 45%, #03050a 100%);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .app {
      width: min(92vw, 980px);
      height: min(88vh, 700px);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 0 30px rgba(106, 156, 255, 0.12);
      border: 1px solid rgba(130, 180, 255, 0.22);
      backdrop-filter: blur(5px);
      background: linear-gradient(135deg, rgba(21, 31, 52, 0.75), rgba(8, 12, 25, 0.65));
    }
    #scene {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #scene:active { cursor: grabbing; }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 8px 14px;
      font-size: 14px;
      letter-spacing: 0.02em;
      color: #deebff;
      border-radius: 999px;
      border: 1px solid rgba(152, 197, 255, 0.35);
      background: rgba(17, 31, 62, 0.52);
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(130, 189, 255, 0.45);
    }
  </style>
</head>
<body>
  <main class="app">
    <canvas id="scene"></canvas>
    <div class="hint">拖拽鼠标可旋转地球，滚轮可缩放</div>
  </main>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0.5, 3.2);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 1.6;
    controls.maxDistance = 6;
    controls.enablePan = false;

    scene.add(new THREE.AmbientLight(0x9bbcff, 0.55));

    const key = new THREE.DirectionalLight(0xffffff, 1.25);
    key.position.set(5, 2, 5);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x7bb1ff, 0.7);
    rim.position.set(-4, -1, -3);
    scene.add(rim);

    const loader = new THREE.TextureLoader();
    const earthTexture = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const bumpTexture = loader.load('https://threejs.org/examples/textures/planets/earth_bump_2048.jpg');
    const specTexture = loader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(1, 96, 96),
      new THREE.MeshPhongMaterial({
        map: earthTexture,
        bumpMap: bumpTexture,
        bumpScale: 0.04,
        specularMap: specTexture,
        specular: new THREE.Color(0x304060),
        shininess: 22,
      })
    );
    scene.add(earth);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.03, 96, 96),
      new THREE.MeshBasicMaterial({
        color: 0x71b5ff,
        transparent: true,
        opacity: 0.18,
        side: THREE.BackSide,
      })
    );
    scene.add(atmosphere);

    const stars = new THREE.Mesh(
      new THREE.SphereGeometry(28, 64, 64),
      new THREE.MeshBasicMaterial({
        map: loader.load('https://threejs.org/examples/textures/planets/starfield.jpg'),
        side: THREE.BackSide,
      })
    );
    scene.add(stars);

    function resize() {
      const { clientWidth, clientHeight } = canvas.parentElement;
      renderer.setSize(clientWidth, clientHeight, false);
      camera.aspect = clientWidth / clientHeight;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    resize();

    function animate() {
      earth.rotation.y += 0.0016;
      atmosphere.rotation.y += 0.001;
      stars.rotation.y += 0.00015;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
